[package]
name = "docvault"
version = "0.1.0"
description = "完全离线的跨平台文档管理、编辑与转换软件"
authors = ["docvault"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
mime_guess = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }

# docx parsing
docx-rs = "0.4"

# pdf generation
printpdf = "0.7"
lopdf = "0.32"
genpdf = { version = "0.2", features = ["images"] }
rusttype = "0.9"

# xlsx parsing
calamine = "0.25"

# zip handling (docx/xlsx are zip archives)
zip = "2"

# image handling for embedded media
image = "0.25"

# logging
log = "0.4"
env_logger = "0.11"

[features]
default = []
